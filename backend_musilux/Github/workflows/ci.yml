name: Pruebas CI
on:
  push:
    branches: [ adanDeveloper ]
  pull_request:
    branches: [ adanDeveloper ]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up PHP
        uses: shivammathur/setup-php@v4
        with:
          php-version: '8.2'
          extensions: mbstring,intl,pdo,pdo_sqlite,openssl,curl,json,xml
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
        working-directory: backend_musilux
      - name: Setup environment
        run: |
          cp .env.example .env
          php artisan key:generate
        working-directory: backend_musilux
      - name: Run backend tests
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STRIPE_SECRET: ${{ secrets.STRIPE_SECRET }}
          STRIPE_PUBLICABLE: ${{ secrets.STRIPE_PUBLICABLE }}
        run: ./vendor/bin/phpunit --configuration phpunit.xml
        working-directory: backend_musilux

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.11.0'
      - name: Install dependencies
        run: flutter pub get
        working-directory: musilux
      - name: Run Flutter tests
        run: flutter test
        working-directory: musilux