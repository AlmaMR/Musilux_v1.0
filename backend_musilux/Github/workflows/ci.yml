name: Pruebas CI Automatizadas
on:
  push:
    branches: [adanDeveloper]
  pull_request:
    branches: [adanDeveloper]
  workflow_dispatch: # Permite ejecutar manualmente desde GitHub

jobs:
  backend:
    name: Backend Tests (PHP/Laravel)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring,intl,pdo,pdo_sqlite,openssl,curl,json,xml,zip,gd
          coverage: xdebug

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend_musilux/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend_musilux/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --optimize-autoloader
        working-directory: backend_musilux

      - name: Setup environment
        run: |
          cp .env.example .env || cp .env.ci .env || echo "APP_KEY=base64:$(openssl rand -base64 32)" > .env
          php artisan key:generate --show || echo "Laravel key generation skipped"
        working-directory: backend_musilux

      - name: Run backend tests
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STRIPE_SECRET: ${{ secrets.STRIPE_SECRET }}
          STRIPE_PUBLICABLE: ${{ secrets.STRIPE_PUBLICABLE }}
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: ./vendor/bin/phpunit --configuration phpunit.xml --verbose --colors=always
        working-directory: backend_musilux

  flutter:
    name: Frontend Tests (Flutter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.11.0'
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            musilux/.flutter-plugins
            musilux/.flutter-plugins-dependencies
          key: ${{ runner.os }}-flutter-${{ hashFiles('musilux/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-flutter-

      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: musilux

      - name: Run Flutter analyze
        run: flutter analyze
        working-directory: musilux

      - name: Run Flutter tests
        run: flutter test --coverage
        working-directory: musilux

  # Job opcional para generar reportes de cobertura
  coverage:
    name: Generate Coverage Reports
    runs-on: ubuntu-latest
    needs: [backend, flutter]
    if: success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./backend_musilux/coverage.xml
          flags: backend
          name: Backend Coverage
          fail_ci_if_error: false

      - name: Upload Flutter coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./musilux/coverage/lcov.info
          flags: flutter
          name: Flutter Coverage
          fail_ci_if_error: false
          file: ./backend_musilux/coverage.xml
          flags: backend
          name: Backend Coverage
          fail_ci_if_error: false

      - name: Upload Flutter coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./musilux/coverage/lcov.info
          flags: flutter
          name: Flutter Coverage
          fail_ci_if_error: false